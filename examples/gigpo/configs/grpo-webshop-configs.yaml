# GRPO 与 GiGPO 对照实验的共同基线；所有相对路径均相对于本配置文件。
output_dir: ../../../output/webshop-grpo-qwen3.5-4b-s100-b16-g8-mb64-json-fullctx-seed42

algorithm: grpo

data:
  repo_id: YWZBrandon/webshop-data
  revision: ce990fff5aee388db2706f07820c578ab68e0453
  local_files_only: true
  # train=[1500,N)，eval=[500,1500)，test=[0,500)。
  split_protocol: official
  seed: 42
  # 100 个 rollout 批次，共消费 1,600 个训练目标。
  train_epochs: 1
  eval_limit: null

environment:
  source_dir: ../../../.cache/webshop
  seed: 42

trainer:
  model:
    name: Qwen/Qwen3.5-4B
    lora_rank: 32
  training:
    # 保留 GRPO 的 batch=16，每批执行两次 actor 更新。
    batch_size: 16
    max_steps: 100
    seed: 42
  rollout:
    # 每目标 8 个候选，共 12,800 条训练轨迹。
    num_generations: 8
    temperature: 1.0
    top_p: 1.0
  actor:
    gae_timestep_unit: turn
    kl_ctl: 0.0
    reference_kl_coef: 0.01
    loss_backend: custom
    dynamic_sampling: false
    ppo_n_minibatches: 2
    update_epochs: 1
  optimizer:
    learning_rate: 0.000001
  evaluation:
    # 原始模型基线已单独测试；训练结束时在完整 eval 划分评估一次。
    before_train: false
    after_train: true
    steps: 0
    batch_size: 4
    max_batches: null
  checkpoint:
    save_every: 25
  reporting:
    log_dir: ../../../output/webshop-grpo-qwen3.5-4b-s100-b16-g8-mb64-json-fullctx-seed42/metrics
    report_to: swanlab
    workspace: pytrio
    project: gigpo-webshop
    run_name: grpo-qwen3.5-4b-s100-b16-g8-mb64-json-fullctx-lr1e-6-seed42

agent:
  parser: strict_json
  renderer: token_append
  advertise_tools: false
  template_kwargs:
    enable_thinking: false
  export_mode: concat
  # 固定策略快照完成整个更新批，保证组内候选可比较。
  async_rollouts: false
  max_concurrency: 2
  on_system_failure: raise
  limits:
    # 购买后立即结束，预算与 GiGPO 相同。
    max_turns: 16
    max_tokens_per_turn: 256
    max_generated_tokens: 4096
    max_context_tokens: 32768
    sampling_timeout: 120
    tool_timeout: 60
    episode_timeout: 1800
  retry:
    max_attempts: 2
    retry_tools: false
  evaluation:
    num_generations: 1
    seed: 1729
    pass_ks: [1]

reward:
  mode: sparse
  success_reward: 10.0
