# All relative paths are resolved against this file.
output_dir: ../../../output/calculator-agent
trainer:
  algorithm: grpo
  model:
    name: Qwen/Qwen3.5-4B
    lora_rank: 8
  training:
    batch_size: 2
    max_steps: 2
    seed: 42
  rollout:
    num_generations: 4
    max_tokens: 1024
    temperature: 1.0
    top_p: 1.0
  actor:
    gae_timestep_unit: turn
    discount: 1.0
    gae_lambda: 1.0
  optimizer:
    learning_rate: 0.00004
  evaluation:
    before_train: true
    after_train: true
    steps: 1
    batch_size: 2
  checkpoint:
    save_every: 0
  reporting:
    log_dir: ../../../output/calculator-agent/metrics
    report_to: null
agent:
  parser: strict_json
  renderer: token_append
  advertise_tools: false
  template_kwargs:
    enable_thinking: false
  stop: null
  max_concurrency: 4
  on_system_failure: drop_group
  max_refill_batches: 8
  limits:
    max_turns: 5
    max_tokens_per_turn: 256
    max_generated_tokens: 1024
    max_context_tokens: 8192
    sampling_timeout: 120
    tool_timeout: 10
    episode_timeout: 360
  retry:
    max_attempts: 3
    initial_delay: 0.2
    max_delay: 2
    multiplier: 2
    retry_tools: true
  evaluation:
    num_generations: 4
    seed: 1729
    pass_ks: [1, 2, 4]
reward:
  tool_call: 0.01
  invalid_call: 0.05
  generated_token: 0.0
  format_reward: 0.02
  turn_discount: 1.0
data:
  train_tasks: 32
  eval_tasks: 8
  seed: 42
