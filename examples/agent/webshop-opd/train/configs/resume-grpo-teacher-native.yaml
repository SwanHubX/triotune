# Control continuation: resume the completed step-200 GRPO teacher for 200
# additional updates without changing its native WebShop task-score reward.
output_dir: ../../../../../output/webshop-opd/train/grpo-teacher-native-resume-s200-to400-b8-g8-seed42

data:
  repo_id: YWZBrandon/webshop-data
  revision: ce990fff5aee388db2706f07820c578ab68e0453
  directory: ../../../../../data/webshop-opd/assets
  local_files_only: true
  split_protocol: official
  seed: 42
  train_epochs: 1
  eval_limit: 200

environment:
  source_dir: ../../../../../data/webshop-opd/WebShop
  seed: 42

continuation:
  checkpoint: trio://run_n9e12csgxlof/weights/ppo-step-00000200
  global_step: 200
  additional_steps: 200

# Preserve the original GRPO training objective: terminal reward is the native
# WebShop task_score for purchases and zero for non-purchases. Evaluation also
# uses the native score.
reward:
  mode: native

trainer:
  model:
    name: Qwen/Qwen3.5-4B
    lora_rank: 32
  training:
    batch_size: 8
    seed: 42
  rollout:
    num_generations: 8
    max_tokens: 7680
    temperature: 1.0
    top_p: 1.0
    prompt_key: messages
    chat_template_kwargs:
      enable_thinking: false
  actor:
    gae_timestep_unit: turn
    kl_ctl: 0.0
    reference_kl_coef: 0.01
    loss_backend: custom
    dynamic_sampling: false
    ppo_n_minibatches: 1
    update_epochs: 1
  optimizer:
    learning_rate: 0.000001
    grad_clip_norm: 1.0
  checkpoint:
    state_dir: ../../../../../output/webshop-opd/train/grpo-teacher-native-resume-s200-to400-b8-g8-seed42/state
    save_every: 20
    sampler:
      enabled: true
  evaluation:
    steps: 20
    before_train: true
    after_train: true
    batch_size: 8
    max_batches: null
  reporting:
    report_to: swanlab
    workspace: pytrio
    project: webshop-agentrl-TCOD
    tags: [grpo, resume, native-reward, step200, step400]
    run_name: grpo-teacher-native-resume-s200-to400-b8-g8-seed42
    log_dir: ../../../../../output/webshop-opd/train/grpo-teacher-native-resume-s200-to400-b8-g8-seed42/metrics
    logging_step: 1

agent:
  parser: strict_json
  renderer: token_append
  advertise_tools: false
  template_kwargs:
    enable_thinking: false
  export_mode: concat
  async_rollouts: false
  max_concurrency: 4
  on_system_failure: raise
  limits:
    max_turns: 15
    max_tokens_per_turn: 512
    max_generated_tokens: 7680
    max_context_tokens: 10240
    sampling_timeout: 120
    tool_timeout: 60
    episode_timeout: 1800
  retry:
    max_attempts: 2
    retry_tools: false
  evaluation:
    num_generations: 1
    seed: 42
    pass_ks: [1]
    temperature: 0.4
    top_p: 1.0
