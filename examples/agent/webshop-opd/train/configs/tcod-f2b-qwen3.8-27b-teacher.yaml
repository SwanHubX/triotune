# Distill Qwen3.8-27B into a fresh Qwen3.5-4B student with TCOD-F2B.
# Run 200 updates while expanding the student rollout prefix from 1 to 15 turns.
output_dir: ../../../../../output/webshop-opd/train/tcod-f2b-qwen3.5-4b-qwen3.8-27b-k1-g4-s200-b16-t15-eval1-e20-lr1e-6-kl1-seed42

data:
  repo_id: YWZBrandon/webshop-data
  revision: ce990fff5aee388db2706f07820c578ab68e0453
  directory: ../../../../../data/webshop-opd/assets
  local_files_only: true
  split_protocol: official
  seed: 42
  train_epochs: 1
  eval_limit: 200

# Zero-based completed updates: k=min(k_start + step//growth_interval, 15).
# Updates 1-4 use k=1; updates 5-8 use k=2; update 57 reaches k=15.
curriculum:
  k_start: 1
  growth_interval: 4

environment:
  source_dir: ../../../../../data/webshop-opd/WebShop
  seed: 42

trainer:
  # Start the student from the base model, with no resumed checkpoint.
  model:
    name: Qwen/Qwen3.5-4B
    lora_rank: 32
  teacher:
    name: Qwen/Qwen3.8-27B
    model_path: null
  training:
    batch_size: 16
    max_steps: 200
    seed: 42
  optimizer:
    learning_rate: 0.000001
    grad_clip_norm: 1.0
  checkpoint:
    save_every: 20
    state_dir: ../../../../../output/webshop-opd/train/tcod-f2b-qwen3.5-4b-qwen3.8-27b-k1-g4-s200-b16-t15-eval1-e20-lr1e-6-kl1-seed42/state
    sampler:
      enabled: true
  evaluation:
    steps: 20
    before_train: true
    after_train: true
  rollout:
    # Generate one independent prefix per task, up to the current curriculum k.
    # Behavior sampling stays at temperature/top-p 1.0 for the OPD update.
    num_generations: 1
    max_completion_length: 512
    max_length: 10752
    prompt_key: messages
    add_generation_prompt: true
    chat_template_kwargs:
      enable_thinking: false
    stop: null
  execution:
    max_concurrent_sampling: 4
    max_concurrent_scoring: 32
  objective:
    kl_coef: 1.0
    # Preserve vanilla OPD token signals within the current rollout prefix.
    discount_factor: 0.0
    importance_ratio_cap: 5.0
  reporting:
    report_to: swanlab
    workspace: pytrio
    project: webshop-agentrl-TCOD
    tags: [opd, tcod-f2b, qwen3.5-4b, qwen3.8-27b-teacher]
    run_name: tcod-f2b-qwen3.5-4b-qwen3.8-27b-k1-g4-s200-b16-t15-eval1-e20-lr1e-6-kl1-seed42
    log_dir: ../../../../../output/webshop-opd/train/tcod-f2b-qwen3.5-4b-qwen3.8-27b-k1-g4-s200-b16-t15-eval1-e20-lr1e-6-kl1-seed42/metrics
    logging_step: 1

agent:
  parser: strict_json
  renderer: token_append
  advertise_tools: false
  template_kwargs:
    enable_thinking: false
  export_mode: concat
  # Synchronous OPD consumes fresh rollouts, so policy staleness remains zero.
  async_rollouts: false
  max_concurrency: 4
  on_system_failure: raise
  limits:
    # Fixed evaluation budget and maximum training horizon.
    # Training temporarily uses k; all other budgets stay unchanged.
    max_turns: 15
    max_tokens_per_turn: 512
    max_generated_tokens: 10240
    max_context_tokens: 10240
    sampling_timeout: 120
    tool_timeout: 60
    episode_timeout: 1800
  retry:
    max_attempts: 2
    retry_tools: false
  evaluation:
    # One independent attempt per task reports Pass@1 only.
    num_generations: 1
    seed: 42
    pass_ks: [1]
    temperature: 0.4
    top_p: 1.0
