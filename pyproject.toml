[project]
name = "triotune"
version = "0.1.2"
description = "PyTRIO-native training utilities and recipes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.1",
    "numpy==2.5.3",
    "pytrio==0.2.9",
    "pyyaml==6.0.3",
    "swanlab==0.10.1",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dpo = ["torch>=2.3"]
ppo = ["torch>=2.3"]
openai = ["openai>=1.66,<3"]
openai-proxy = ["openai>=1.66,<3", "fastapi>=0.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "triotune",
    "triotune.api",
    "triotune.agentrl",
    "triotune.agentrl.runtime",
    "triotune.agentrl.rollout",
    "triotune.agentrl.training",
    "triotune.agentrl.diagnostics",
    "triotune.agentrl.integrations",
    "triotune.agentrl.integrations.openai",
    "triotune.dataset",
    "triotune.trainer",
    "triotune.trainer.dpo",
    "triotune.trainer.sft",
    "triotune.trainer.opd",
    "triotune.trainer.ppo",
    "triotune.utils",
]

[tool.uv]
package = true
