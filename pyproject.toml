[project]
name = "triotune"
version = "0.1.1"
description = "PyTRIO-native training utilities and recipes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.1",
    "numpy==2.5.3",
    "pytrio==0.2.9",
    "pyyaml==6.0.3",
    "swanlab==0.10.1",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dpo = ["torch>=2.3"]
ppo = ["torch>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "trio_cookbook",
    "trio_cookbook.api",
    "trio_cookbook.dataset",
    "trio_cookbook.dataset.swe_sft",
    "trio_cookbook.trainer",
    "trio_cookbook.trainer.dpo",
    "trio_cookbook.trainer.sft",
    "trio_cookbook.trainer.opd",
    "trio_cookbook.trainer.ppo",
    "trio_cookbook.utils",
]

[tool.setuptools.package-dir]
trio_cookbook = "triotune"
"trio_cookbook.trainer" = "triotune/trainer"

[tool.uv]
# Install the ``triotune`` source directory under the stable public import
# name ``trio_cookbook`` via the setuptools mapping above.
package = true
