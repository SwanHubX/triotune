[project]
name = "trio-cookbook"
version = "0.1.0"
description = "PyTRIO-native GRPO training utilities and recipes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.1",
    "numpy==2.5.3",
    "pytrio==0.2.9",
    "swanlab==0.10.1",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dpo = ["torch>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trio_cookbook", "trio_cookbook.trainer", "trio_cookbook.utils"]

[tool.setuptools.package-dir]
trio_cookbook = "trio-cookbook"
"trio_cookbook.trainer" = "trio-cookbook/trainer"
"trio_cookbook.utils" = "trio-cookbook/utils"

[tool.uv]
# Keep the historical on-disk directory name while installing it under the
# valid Python import name ``trio_cookbook`` via the setuptools mapping above.
package = true
