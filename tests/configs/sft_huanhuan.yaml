# recipes/train_sft.py 读取本文件。
# sft 与 swanlab 合并为 triotune.trainer.sft.SFTConfig。
# model 和 data 是 recipe 的模型初始化与数据准备参数。

model:
  name: Qwen/Qwen3.5-4B
  lora_rank: 8

data:
  file: data/huanhuan.json
  limit: 100
  epochs: 1

sft:
  batch_size: 1
  max_in_flight: 32
  max_steps: 100
  max_length: 384
  learning_rate: 0.0001
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001
  seed: 42
  save_every: 0
  chat_template_kwargs:
    enable_thinking: false

swanlab:
  report_to: swanlab
  project: cookbook-test
  run_name: huanhuan-framework-100step-seed42
  workspace: pytrio
  tags: [sft, trainer]
  # log_dir: swanlog
