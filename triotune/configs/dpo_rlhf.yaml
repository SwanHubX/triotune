# recipes/train_dpo.py 读取本文件。
# dpo 与 swanlab 合并为 trio_cookbook.trainer.dpo.DPOConfig。
# model 和 data 是 recipe 的模型初始化与数据准备参数。

model:
  name: Qwen/Qwen3.5-4B
  lora_rank: 32

data:
  file: data/hh_rlhf_train.jsonl
  cache_dir: .cache/modelscope/hh-rlhf
  repo: Anthropic/hh-rlhf
  revision: master
  subsets: [helpful-base]
  split: train
  sample_size: 1000
  seed: 42

dpo:
  beta: 0.1
  batch_size: 2
  max_steps: 50
  max_length: 2048
  learning_rate: 0.00001
  seed: 42
  add_eos_token: false
  chat_template_kwargs:
    enable_thinking: false

swanlab:
  report_to: swanlab
  logging_step: 1
  project: cookbook-test
  workspace: pytrio
  run_name: hh-rlhf
  tags: [dpo, hh-rlhf, trainer]
