[model]
name = "Qwen/Qwen3.5-4B"
lora_rank = 8

[data]
file = "data/huanhuan.json"
limit = 100
epochs = 1

[sft]
batch_size = 1
max_steps = 100
max_length = 384
learning_rate = 1e-4
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
seed = 42
save_every = 0

[sft.chat_template_kwargs]
enable_thinking = false

[swanlab]
report_to = "swanlab"
project = "huanhuan-chat-sft"
run_name = "huanhuan-framework-100step-seed42"
