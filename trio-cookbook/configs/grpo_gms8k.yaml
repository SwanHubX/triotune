# Modular GRPO configuration. recipes/train_grpo.py merges each module into
# PPOConfig after applying the selected algorithm preset.
algorithm: grpo

model:
  name: Qwen/Qwen3.5-9B
  lora_rank: 32

data:
  file: data/gsm8k_train.jsonl
  cache_dir: .cache/huggingface
  # max_examples: 16

training:
  batch_size: 4
  max_steps: 100
  seed: 42

optimizer:
  lr: 0.00004
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001

rollout:
  group_size: 8
  max_new_tokens: 1024
  temperature: 1.0
  top_p: 1.0
  chat_template_kwargs:
    enable_thinking: false

actor:
  eps_clip: 0.2
  kl_ctl: 0.0
  kl_estimator: k1
  reward_norm:
    mean_level: group
    std_level: group
  adv_norm:
    mean_level: batch
    std_level: batch
  discount: 1.0
  gae_lambda: 1.0
  importance_sampling_level: token
  loss_aggregation: token_mean
  use_decoupled_loss: false
  recompute_logprob: false
  dynamic_sampling: false
  overlong_tokens: 0
  loss_type: ppo
  loss_backend: custom
  update_epochs: 1
  ppo_n_minibatches: 1

# Used only when actor.kl_ctl is greater than zero. If omitted, the student
# base model is used as the frozen reference policy.
reference:
  path: ${model.name}

critic:
  enabled: false

swanlab:
  report_to: swanlab
  project: cookbook-test
  run_name: gsm8k-grpo
  workspace: pytrio
  tags: [grpo, gsm8k]
