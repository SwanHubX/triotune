[model]
name = "Qwen/Qwen3.5-9B"
lora_rank = 32

[data]
file = "data/gsm8k_train.jsonl"
cache_dir = ".cache/huggingface"
# max_examples = 16

[grpo]
num_generations = 8
max_completion_length = 1024
temperature = 1.0
top_p = 1.0
batch_size = 4
max_steps = 100
stop = true
output_dir = true
learning_rate = 4e-5
beta1 = 0.9
beta2 = 0.95
seed = 42
# save_every defaults to max_steps; set 0 to disable checkpoints.

[grpo.chat_template_kwargs]
enable_thinking = false

[swanlab]
mode = "online"
project = "cookbook-grpo-test"
run_name = "gsm8k"
workspace = "pytrio"
tags = ["grpo", "gsm8k"]
