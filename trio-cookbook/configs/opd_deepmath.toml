# recipes/opd_deepmath_trio.py 读取本文件。
# [opd] 与 [swanlab] 合并为 trio_cookbook.trainer.opd.OPDConfig。
# 数据下载、prompt 构造和循环批次由 recipe 管理，训练使用 train_async()。

[model]
name = "Qwen/Qwen3.5-4B"
lora_rank = 32

[teacher]
name = "Qwen/Qwen3.8-27B"
# model_path = "trio://..."  # 可选教师 LoRA checkpoint，词表须与学生一致。

[data]
repo = "AI-ModelScope/DeepMath-103K"
revision = "master"
dataset_dir = ".cache/modelscope/DeepMath-103K"
num_shards = 1            # 前 N 个 train parquet 分片；完整数据为 10 个。
sample_size = 1000        # 打乱后抽样；<=0 使用已加载分片的全部数据。
seed = 42
question_suffix = 'Please solve the problem step by step and put the final answer in \boxed{}.'

[runtime]
timeout = 600

[opd]
max_steps = 50
batch_size = 2
num_generations = 2
max_completion_length = 512
max_length = 2048
max_concurrent_sampling = 16
max_concurrent_scoring = 32
kl_coef = 1.0
discount_factor = 0.0
importance_ratio_cap = 5.0
learning_rate = 4e-5
beta1 = 0.9
beta2 = 0.95
seed = 42
save_every = 0            # 不保存中间状态，训练成功后仍保存最终状态。
stop = ["<|im_end|>"]

[opd.chat_template_kwargs]
enable_thinking = false

[swanlab]
report_to = "swanlab"
logging_step = 1
project = "cookbook-test"
workspace = "pytrio"
run_name = "opd-deepmath-qwen35-4b-framework-async"
tags = ["opd", "deepmath", "modelscope", "trainer", "async"]
